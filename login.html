<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ورود | حلقات صالحین</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="responsive.css">
</head>

<body class="auth-page">

    <main class="auth-card">

        <div class="auth-logo">ح</div>

        <h1>خوش آمدی 🌱</h1>

        <p class="auth-description">
            برای ورود به پیام‌رسان حلقات صالحین، اطلاعاتت رو وارد کن.
        </p>

        <form id="loginForm">

            <label for="phone">شماره تلفن</label>
            <input
                type="tel"
                id="phone"
                name="phone"
                inputmode="tel"
                placeholder="شماره تلفن"
                autocomplete="tel"
                required
            >

            <label for="password">رمز عبور</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="رمز عبور"
                autocomplete="current-password"
                required
            >

            <button type="submit" class="auth-submit">
                ورود به حساب
            </button>

            <p id="formMessage" class="form-message" role="status"></p>

        </form>

        <div class="auth-footer">
            <span>حساب کاربری نداری؟</span>
            <a href="register.html">ثبت‌نام کن</a>
        </div>

    </main>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="responsive.css">
</body>
</html>
