<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ثبت‌نام | حلقات صالحین</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="responsive.css">
</head>

<body class="auth-page">

    <main class="auth-card">

        <div class="auth-logo">ح</div>

        <h1>عضویت در حلقات صالحین</h1>

        <p class="auth-description">
            اطلاعاتت رو وارد کن تا درخواست عضویتت ثبت بشه.
        </p>

        <form id="registerForm">

            <label for="fullName">نام و نام خانوادگی</label>
            <input
                type="text"
                id="fullName"
                name="fullName"
                placeholder="نام و نام خانوادگی"
                autocomplete="name"
                required
            >

            <label for="phone">شماره تلفن همراه</label>
            <input
                type="tel"
                id="phone"
                name="phone"
                inputmode="tel"
                placeholder="شماره تلفن همراه"
                autocomplete="tel"
                required
            >

            <label for="nationalId">کد ملی</label>
            <input
                type="password"
                id="nationalId"
                name="nationalId"
                inputmode="numeric"
                maxlength="10"
                placeholder="کد ملی ۱۰ رقمی"
                autocomplete="off"
                required
            >

            <label for="password">رمز عبور</label>
            <input
                type="password"
                id="password"
                name="password"
                minlength="8"
                placeholder="حداقل ۸ نویسه"
                autocomplete="new-password"
                required
            >

            <label for="confirmPassword">تکرار رمز عبور</label>
            <input
                type="password"
                id="confirmPassword"
                name="confirmPassword"
                minlength="8"
                placeholder="رمز عبور را تکرار کن"
                autocomplete="new-password"
                required
            >

            <button type="submit" class="auth-submit">
                ارسال درخواست عضویت
            </button>

            <p id="formMessage" class="form-message" role="status"></p>

        </form>

        <div class="auth-footer">
            <span>قبلاً ثبت‌نام کردی؟</span>
            <a href="login.html">ورود به حساب</a>
        </div>

        <p class="auth-footnote">
            عضویت پس از تأیید مسئول فعال خواهد شد.
        </p>

    </main>

    <script>
        const form = document.getElementById("registerForm");
        const message = document.getElementById("formMessage");

        form.addEventListener("submit", function (event) {
            event.preventDefault();

            const password =
                document.getElementById("password").value;

            const confirmPassword =
                document.getElementById("confirmPassword").value;

            const nationalId =
                document.getElementById("nationalId").value.trim();

            if (!/^\d{10}$/.test(nationalId)) {
                message.textContent =
                    "کد ملی باید ۱۰ رقم باشد.";
                return;
            }

            if (password !== confirmPassword) {
                message.textContent =
                    "رمز عبور و تکرار آن یکسان نیستند.";
                return;
            }

            message.textContent =
                "ظاهر فرم آماده است؛ برای ثبت درخواست واقعی باید سرور امن متصل شود.";
        });
    </script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="responsive.css">
</body>
</html>
